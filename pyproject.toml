[project]
name = "py-case-follow-up"
version = "1.2.0"
description = "A python program to keep track of open processes where progress might be slow and responsibilities might shift over time. Including integration with other tools, customizable reminders, search functionality, different views and many other functions."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama==0.4.6",
    "customtkinter==6.0.0",
    "darkdetect==0.8.0",
    "iniconfig==2.3.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "packaging==26.3",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "Pygments==2.21.0",
    "pyinstaller>=6.22.2",
    "pystray>=0.19.5",
    "pytest==9.1.1",
    "six==1.17.0",
    "winotify>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]

# NOTE: pyright is configured via pyrightconfig.json at the project root, not
# here. pyright uses pyrightconfig.json exclusively whenever it's present and
# silently ignores any [tool.pyright] section in this file - a [tool.pyright]
# block used to live here (including a pythonPlatform = "Windows" setting)
# but it was never actually being read by `uvx pyright`, which is why
# Windows-only stdlib members (os.startfile, ctypes.windll, sys._MEIPASS)
# kept getting flagged in CI despite that setting. See pyrightconfig.json for
# the real pythonPlatform/stubPath/venv configuration.

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py314"
# Long lines are common throughout (mostly i18n tr(...) calls with long
# German default strings) - not worth a mass reformat right now, so line
# length is left unchecked rather than fighting the whole codebase at once.
line-length = 200
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Deliberately narrow starter set focused on real-bug classes rather than
# style nits, since this is the first lint pass this project has ever had:
#   F  (pyflakes)   - unused imports, undefined names, redefined functions/
#                      methods (this alone would have caught the duplicate
#                      focus_wiki_search() and the missing filedialog import
#                      pyright turned up in the last pyright cleanup pass)
#   E/W (pycodestyle) - basic style/whitespace correctness
#   B  (flake8-bugbear) - common real-bug patterns (mutable default args,
#                      loop-variable closures, etc.)
#   UP (pyupgrade)  - modernizes syntax to match requires-python >=3.14
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # line length - see line-length comment above
]

[tool.ruff.lint.per-file-ignores]
# Test files commonly shadow fixture names and use star-ish patterns that
# are fine in test context but would be flagged as real-code smells elsewhere.
"tests/*" = ["F841"]

